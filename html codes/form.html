<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>

    <form action="/action"><!--you can the submit button click and to move the /action -->
        <div>
        <label for="username">Username :</label>
         <input type="text" placeholder="Enter The Name" id="username">         
         <!--this is pair for the label and input to create the input box-->
       </div>
       <br>
        <div>
        <label for="password">Password :</label>
        <input type="password" placeholder="Enter the password" id="password">
        </div>
         <br>
           
         <div>
           
        <label for="age">Age :</label>
        <input type="number" placeholder="Enter The Number" id="age">
       </div>
       <br>
        <button type="submit">submit</button>
       <button type="button">button</button>
       <button type="reset">reset</button>
       <!--that is verious button to perform many other task to reset, sumbitand button-->
       
      
       <br>
    </form>
  </body>
</html>
